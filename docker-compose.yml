services:
  voice:
    build:
      context: ../..
      dockerfile: apps/voice/Dockerfile
    env_file: .env
    ports:
      - "40000-40031:40000-40031/udp"
      - "40000-40031:40000-40031/tcp"
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
